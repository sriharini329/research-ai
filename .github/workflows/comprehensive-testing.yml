name: Comprehensive Enterprise E2E Testing
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, validation, performance, deployment, selenium, appium]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Setup Java (For Appium)
        if: matrix.suite == 'appium'
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mupdf mupdf-tools swig libfreetype6-dev
          
      - name: Install Python Dependencies & Start Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flask flask-sqlalchemy flask-cors pymysql fitz pymupdf requests python-dotenv werkzeug
          nohup python research_ai_app.py > backend.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:5000 || echo "Backend might not be fully up, but continuing..."
          
      - name: Install Node Dependencies
        run: |
          cd testing
          npm install
          cd ${{ matrix.suite }}
          npm install
          
      - name: Run ${{ matrix.suite }} tests
        run: |
          cd testing
          npm run test:${{ matrix.suite }}
          
      - name: Upload Suite Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.suite }}
          path: testing/${{ matrix.suite }}/mochawesome-report/

  master-report:
    needs: test-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install Master Report Dependencies
        run: |
          cd testing
          npm install
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: testing/artifacts
          
      - name: Structure Artifacts
        run: |
          # Create directories and move downloaded mochawesome reports so generate.js finds them
          for suite in api validation performance deployment selenium appium; do
            mkdir -p testing/$suite/mochawesome-report
            if [ -d "testing/artifacts/report-$suite" ]; then
              cp testing/artifacts/report-$suite/* testing/$suite/mochawesome-report/ || true
            fi
          done
          
      - name: Generate Master Report
        run: |
          cd testing
          npm run report:master
          
      - name: Upload Final Master Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: |
            testing/Research_AI_E2E_Master_Test_Report.xlsx
            testing/reports/
