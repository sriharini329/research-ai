name: Android E2E Tests (Appium)

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: |
          cd e2e
          npm install

      - name: Install Appium Drivers
        run: |
          cd e2e
          npx appium driver install uiautomator2
          npx appium driver install flutter || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Move APK for Appium
        run: |
          mkdir -p e2e/app
          cp build/app/outputs/flutter-apk/app-debug.apk e2e/app/app-release.apk

      - name: Run E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            cd e2e
            nohup npm run appium:start &
            sleep 15
            npm run test:all

      - name: Upload Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-E2E-Report-Excel
          path: e2e/reports/Flutter_E2E_Report.xlsx

      - name: Upload Mochawesome HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome-Report
          path: e2e/mochawesome-report/
