name: Android E2E Tests (Appium)

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: |
          cd e2e
          npm install

      - name: Install Appium 3.x and Drivers
        run: |
          cd e2e
          npm install appium@latest
          npx appium driver install uiautomator2
          npx appium driver install --source=npm appium-flutter-driver || true
          npx appium plugin install execute-driver
          
      - name: Verify Appium Installation
        run: |
          cd e2e
          npx appium --version
          npx appium driver list --installed
          npx appium plugin list

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Run Flutter Widget Tests
        run: flutter test

      - name: Move APK for Appium
        run: |
          mkdir -p e2e/app
          cp build/app/outputs/flutter-apk/app-release.apk e2e/app/app-release.apk

      - name: Run E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            cd e2e
            echo "🔍 --- DISCOVERY PHASE ---"
            # Find and print all test files
            TEST_FILES=$(find tests -name "*.test.js")
            echo "Discovered Test Files:"
            echo "$TEST_FILES"
            
            # Count total test files and individual tests (it blocks)
            FILE_COUNT=$(echo "$TEST_FILES" | wc -l)
            TEST_COUNT=$(grep -rh "it(" tests | wc -l)
            echo "📊 Total Test Files: $FILE_COUNT"
            echo "📊 Total Discovered Test Cases: $TEST_COUNT"
            
            if [ "$TEST_COUNT" -eq 0 ]; then
              echo "❌ ERROR: Zero tests discovered! Stopping pipeline."
              exit 1
            fi
            
            echo "🚀 --- EXECUTION PHASE ---"
            echo "Verifying adb devices detects the emulator..."
            adb devices -l
            
            echo "Installing the APK..."
            adb install -r app/app-release.apk
            
            nohup npm run appium:start &
            sleep 15
            
            # Run tests but don't fail immediately so reports can generate
            npm run test:all || echo "Some tests failed, continuing to report generation..."
            
            echo "📄 --- REPORT GENERATION PHASE ---"
            npm run report:excel
            
            echo "🛡️ --- FAIL-SAFE VALIDATION ---"
            if [ -f "mochawesome-report/mochawesome.json" ]; then
              TESTS_EXECUTED=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('mochawesome-report/mochawesome.json')); console.log(data.stats.tests);")
              echo "Tests executed according to Mochawesome: $TESTS_EXECUTED"
              if [ "$TESTS_EXECUTED" -eq 0 ]; then
                echo "❌ Zero tests executed! Failing the workflow."
                exit 1
              fi
            else
              echo "❌ Mochawesome report not found. Failing the workflow."
              exit 1
            fi
            
            echo "✅ E2E Pipeline completed successfully!"

      - name: Upload Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-E2E-Report-Excel
          path: e2e/reports/Flutter_E2E_Report.xlsx

      - name: Upload Mochawesome Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome-Reports
          path: e2e/mochawesome-report/

      - name: Upload Screenshots and Failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots-Failures
          path: e2e/reports/failures/

      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: e2e/reports/logs/
