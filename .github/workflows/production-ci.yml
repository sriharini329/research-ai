name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies for PyMuPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y mupdf mupdf-tools swig libfreetype6-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-json-report

      - name: Run Backend Tests
        run: |
          pytest --json-report --json-report-file=backend_report.json || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: backend_report.json

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "any"
          channel: "stable"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Widget Tests
        run: |
          flutter test --machine > test_results_frontend.json || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-report
          path: test_results_frontend.json

  web-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Selenium Node Dependencies
        working-directory: ./selenium
        run: |
          npm install

      - name: Run Web E2E Tests
        working-directory: ./selenium
        run: |
          npx mocha --config .mocharc.js --reporter-options reportDir=mochawesome-report,reportFilename=mochawesome-web,html=true,json=true || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: selenium/mochawesome-report/mochawesome-web.json

  android-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "any"
          channel: "stable"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium Node Dependencies
        working-directory: ./appium
        run: |
          npm install
          npm install -g appium
          appium driver install uiautomator2
          appium driver install --source=npm appium-flutter-driver
          mkdir -p app
          cp ../build/app/outputs/flutter-apk/app-release.apk app/app-release.apk

      - name: Run Android Emulator & E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "1. Verifying APK exists..."
            ls -la appium/app/app-release.apk || exit 1

            echo "2. Installing APK manually via ADB..."
            adb install -r appium/app/app-release.apk || exit 1

            echo "3. Launching Application manually via ADB..."
            adb shell am start -n com.example.researchai.research_ai/com.example.researchai.research_ai.MainActivity || exit 1
            sleep 3

            echo "4. Starting Appium server and waiting for it to be fully ready..."
            appium --log-level error:error &
            APPIUM_PID=$!
            sleep 20
            curl -s http://127.0.0.1:4723/status || exit 1

            echo "5. Executing Android E2E Tests..."
            cd appium
            npx mocha --config .mocharc.js --reporter-options reportDir=mochawesome-report,reportFilename=mochawesome-android,html=true,json=true || true
            cd ..

            echo "6. Shutting down Appium gracefully..."

            if [ -n "$APPIUM_PID" ]; then
              kill "$APPIUM_PID" || true
            fi

            pkill -f appium || true
            sleep 2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-report
          path: appium/mochawesome-report/mochawesome-android.json

  generate-reports:
    needs: [backend-tests, flutter-tests, web-e2e-tests, android-e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-report
          path: .

      - name: Download Flutter Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-report
          path: .

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-report
          path: selenium/mochawesome-report/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-report
          path: appium/mochawesome-report/

      - name: Generate Reports
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter
          echo "Generating multi-tier enterprise report..."
          python generate_e2e_report.py

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            E2E-Automation-Reports.zip
            test_results_frontend.json
