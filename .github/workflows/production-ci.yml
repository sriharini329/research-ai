name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest # Using macOS for iOS/Android flexibility
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for PyMuPDF
        run: |
          brew install mupdf swig freetype

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-json-report

      - name: Run Backend Tests
        run: |
          pytest --json-report --json-report-file=backend_report.json || true
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'
          
      - name: Verify Flutter & Dart Versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Widget Tests
        run: |
          flutter test --machine > test_results_frontend.json || true

      - name: Build Android APK
        run: flutter build apk --release
        
      - name: Copy APK for Appium
        run: |
          mkdir -p e2e/app
          cp build/app/outputs/flutter-apk/app-release.apk e2e/app/app-release.apk

      - name: Install E2E Node Dependencies
        working-directory: ./e2e
        run: |
          npm install
          npm list exceljs
          npm install -g appium
          appium driver install uiautomator2
          appium driver install flutter

      - name: Run Appium Server
        run: |
          appium &
        shell: bash

      - name: Run Android Emulator & E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            cd e2e
            npm run test || true

      - name: Generate Reports
        shell: bash
        run: |
          echo "Generating multi-tier enterprise report..."
          python generate_excel_report.py
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            Flutter_E2E_Report.xlsx
            backend_report.json
            test_results_frontend.json
            e2e/mochawesome-report/
