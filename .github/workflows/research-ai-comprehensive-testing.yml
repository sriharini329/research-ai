name: Comprehensive Enterprise E2E Testing
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, validation, performance, deployment, selenium, appium]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Setup Java
        if: matrix.suite == 'appium'
        uses: actions/setup-java@v3
        with: { distribution: "zulu", java-version: "17" }
        
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y mupdf mupdf-tools swig libfreetype6-dev
        
      - name: Clean Old Results
        run: rm -rf testing_v2/*/mochawesome-report || true

      - name: Start Flask Backend
        run: |
          pip install -r requirements.txt || true
          pip install flask flask-sqlalchemy flask-cors pymysql fitz pymupdf requests python-dotenv werkzeug
          nohup python research_ai_app.py > backend.log 2>&1 &
          
          echo "Waiting for Flask to boot..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/get_current_user > /dev/null; then
              echo "Flask backend is up!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done
          
      - name: Start Flutter Web (Selenium Node)
        if: matrix.suite == 'selenium'
        run: |
          nohup python -m http.server 8080 --directory build/web > frontend.log 2>&1 &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then break; fi
            sleep 2
          done
          
      - name: Install Test Dependencies
        run: |
          cd testing_v2
          npm install
          cd ${{ matrix.suite }}
          npm install
          
      - name: Execute API/Validation/Performance/Deployment/Selenium Suites
        if: matrix.suite != 'appium'
        run: |
          cd testing_v2
          npm run test:${{ matrix.suite }}
          
      - name: Enable KVM group perms (Appium)
        if: matrix.suite == 'appium'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          
      - name: Run Android Emulator & Appium Tests (Appium)
        if: matrix.suite == 'appium'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "1. Starting Appium server..."
            npm install -g appium
            appium driver install uiautomator2
            appium --log-level error:error &
            while ! curl -s http://127.0.0.1:4723/status >/dev/null; do sleep 2; done
            
            echo "2. Waiting for emulator boot..."
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do sleep 2; done
            
            echo "3. Executing Appium Tests..."
            cd testing_v2
            npm run test:appium
          
      - name: Upload Suite Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.suite }}
          path: testing_v2/${{ matrix.suite }}/mochawesome-report/

  generate-master:
    needs: test-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Master Report Dependencies
        run: cd testing_v2 && npm install
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with: { path: testing_v2/artifacts }
      - name: Structure Artifacts
        run: |
          for suite in api validation performance deployment selenium appium; do
            mkdir -p testing_v2/$suite/mochawesome-report
            cp testing_v2/artifacts/report-$suite/* testing_v2/$suite/mochawesome-report/ || true
          done
      - name: Generate Master Report
        run: cd testing_v2 && npm run report:master
      - name: Upload Final Master Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ai-master-report
          path: |
            testing_v2/Research_AI_E2E_Master_Test_Report.xlsx
            testing_v2/reports/
